name: FNF Porter Build

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            command: pyinstaller build.spec
          - os: macos-latest
            name: macOS
            command: pyinstaller --onefile psychtobase/main.py --icon=icon.icns --noconsole -n "FNF Porter"
          - os: ubuntu-latest
            name: Linux
            command: pyinstaller --onefile psychtobase/main.py --noconsole -n "FNF Porter"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: ${{ matrix.command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "FNF-Porter (${{ matrix.name }})"
          path: dist/*
          if-no-files-found: error
          retention-days: 14
